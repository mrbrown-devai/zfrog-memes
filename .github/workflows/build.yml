name: Build meme library

on:
  push:
    branches: [main]
    paths: ["memes/**", "scripts/build.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-memes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/build.py
      - name: Commit manifest and thumbnails
        run: |
          git config user.name "zfrog-bot"
          git config user.email "zfrog-bot@users.noreply.github.com"
          git add memes.json thumbs og.jpg
          if git diff --cached --quiet; then
            echo "Nothing to update"
          else
            git commit -m "Update meme library"
            git pull --rebase origin main
            git push
          fi
